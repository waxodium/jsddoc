<svg xmlns="http://www.w3.org/2000/svg" width="100" height="20" role="img" aria-label="License: MIT">
  <title>License: MIT</title>
  <linearGradient id="s" x2="0" y2="100%">
    <stop offset="0" stop-color="#fff" stop-opacity=".1"/>
    <stop offset="1" stop-opacity=".1"/>
  </linearGradient>
  <clipPath id="r">
    <rect width="100" height="20" rx="3" fill="#fff"/>
  </clipPath>
  <g clip-path="url(#r)">
    <rect width="53" height="20" fill="#555555"/>
    <rect x="53" width="47" height="20" fill="#007ec6"/>
    <rect width="100" height="20" fill="url(#s)"/>
  </g>
  <g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,sans-serif" font-size="110">
    <text x="275" y="140" transform="scale(.1)" textLength="430">License</text>
    <text x="755" y="140" transform="scale(.1)" textLength="250">MIT</text>
  </g>
</svg>
